name: Firestore aggregates

on:
  schedule:
    # Every 30 min so ATLAS rank badges and popup caches don't lag more than
    # a rating period behind live data. Aggregate builder uses CDC-friendly
    # queries so most runs read little.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan writes without committing (true/false)
        required: false
        default: "true"
      project:
        description: Firebase project ID
        required: false
        default: rgleaderboard

permissions:
  contents: read
  id-token: write

jobs:
  build-leaderboard-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    env:
      FIREBASE_PROJECT: ${{ github.event.inputs.project || 'rgleaderboard' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          token_format: access_token
          create_credentials_file: true

      - name: Install dependencies
        run: npm ci

      - name: Unit-test cache builder
        run: npm run test:leaderboard-cache

      - name: Build leaderboard aggregates
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          args=(--project "$FIREBASE_PROJECT")
          if [[ "$DRY_RUN" != "true" ]]; then
            args+=(--apply)
          fi
          npm run build:leaderboard-cache -- "${args[@]}"

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-events-aggregates
          path: |
            out/held.json
            out/security-events.jsonl
          if-no-files-found: ignore
          retention-days: 90

  build-streak-records-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    env:
      FIREBASE_PROJECT: ${{ github.event.inputs.project || 'rgleaderboard' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          token_format: access_token
          create_credentials_file: true

      - name: Install dependencies
        run: npm ci

      - name: Build streak-records aggregate
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          args=(--project "$FIREBASE_PROJECT")
          if [[ "$DRY_RUN" != "true" ]]; then
            args+=(--apply)
          fi
          npm run build:streak-records-cache -- "${args[@]}"
